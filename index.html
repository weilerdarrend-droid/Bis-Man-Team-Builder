<title>Bis-Man Team Builder</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent} body{font-family:Arial,sans-serif;margin:0;background:#f4f6f8;color:#203040} header{background:#102a43;color:white;padding:18px} h1{margin:0} main{max-width:1400px;margin:auto;padding:16px}
.toolbar,.panel{background:#fff;border:1px solid #cbd5df;border-radius:10px;padding:12px;margin-bottom:12px} .toolbar{display:flex;gap:8px;flex-wrap:wrap}
button,label.filebtn{min-height:44px;touch-action:manipulation;border:0;border-radius:7px;padding:10px 12px;background:#2f6f9f;color:#fff;font-weight:bold;cursor:pointer} .red{background:#b83232} .gray{background:#526d82} .green{background:#2f855a}
input,select{min-height:44px;font-size:16px;padding:8px;border:1px solid #b8c5d1;border-radius:7px} #newName{flex:1;min-width:200px}
.teams{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px} .team{background:#fff;border:1px solid #cbd5df;border-radius:10px;overflow:hidden} .head{display:flex;gap:6px;padding:9px;background:#eaf0f5} .head input{flex:1;min-width:0;font-weight:bold} .head .red{font-size:20px;width:42px;padding:3px}
.zone{min-height:100px;padding:8px} .zone.over{outline:3px dashed #2f855a;outline-offset:-4px} #unassigned{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:6px}
.person{display:flex;align-items:center;gap:5px;border:1px solid #cbd5df;border-radius:7px;padding:7px;background:#fff;margin:5px 0;cursor:grab} .person .name{flex:1} .person select{max-width:105px;font-size:13px;padding:5px} .mini{padding:5px 8px} #status{font-weight:bold;color:#2f855a}
.printOnly{display:none} #returnBar{display:none;margin-bottom:14px} body.printmode #returnBar{display:block}
body.printmode header,body.printmode .toolbar,body.printmode #unPanel,body.printmode #status,body.printmode .head input,body.printmode .head button,body.printmode .person select,body.printmode .person button{display:none!important}
body.printmode .printOnly{display:block} body.printmode .teams{grid-template-columns:repeat(2,1fr)} body.printmode .team{break-inside:avoid} body.printmode .head{font-weight:bold;font-size:18px}
@media print{header,.toolbar,#unPanel,#status,#returnBar,.person select,.person button,.head input,.head button{display:none!important} .printOnly{display:block} body{background:white} .teams{grid-template-columns:repeat(2,1fr)} .team{break-inside:avoid}}
</style></head><body>
<header><h1>Bis-Man Team Builder</h1></header><main>
<div class="toolbar">
<input id="newName" placeholder="Add bowler name"><button id="addBowler" type="button">Add Bowler</button><button id="addTeam" type="button">+ Add Team</button>
<button id="reset" type="button" class="gray">Reset Assignments</button><button id="save" type="button" class="green">Save / Share Team File</button>
<label class="filebtn gray">Import Saved File<input id="load" type="file" accept=".json" hidden></label>
<button id="printView" type="button" class="gray">Printable View</button>
</div>
<div class="panel"><b>Auto-save is on.</b> The red × removes a team immediately and returns its bowlers to Unassigned. The ↩ button beside a bowler returns that bowler to Unassigned. For PDF, click <b>Printable View</b>, then press <b>Ctrl+P</b> and choose <b>Save as PDF</b>.</div>
<div id="status" class="panel">Ready.</div>
<div id="unPanel" class="panel"><h2>Unassigned <span id="uc"></span></h2><div id="unassigned" class="zone" data-team="u"></div></div>
<div id="returnBar"><button id="returnBuilder" type="button">← Return to Team Builder</button></div><h1 class="printOnly">Bis-Man Team Assignments</h1>
<div id="teams" class="teams"></div>
</main>
<script>
(function(){
var KEY="bisman_v4";
var NAMES=["Carter Bubach", "Connor Sioringas", "Christian Allery", "Ethan Nichols", "Hadley Martin", "Brielle Geir", "Jasmyn Gildea", "Piper Allery", "Samantha Reinhardt", "Zach Weiler", "Aubrey Forde", "Jayden Johnson", "Abigail Portscheller", "Aiden Sauers", "Aubreigh Bubach", "Kyler Freebury", "Kyler Johnson", "Isabel McArthur", "Brooklyn Becker", "Braxton Moritz", "Jayce Austin", "Paige Wilson", "Veda Gehring", "Cassie Zaun", "Leighton Jackson", "Rylan Gilhooly", "Averie Ressler", "Noah Longie", "Colton Fetting", "Lilly Gartner", "Carter Zaun", "Laila Gartner", "Bella Geir"];
var state={teams:["Team 1","Team 2","Team 3","Team 4","Team 5","Team 6"],people:NAMES.map(function(n,i){return{id:i+1,name:n,team:null}}),nextId:NAMES.length+1};
function msg(s){document.getElementById("status").textContent=s}
function saveLocal(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}
function loadLocal(){try{var s=localStorage.getItem(KEY);if(s){var x=JSON.parse(s);if(x.teams&&x.people)state=x}}catch(e){}}
function options(){var s='<option value="">Move...</option><option value="u">Unassigned</option>';state.teams.forEach(function(t,i){s+='<option value="'+i+'">'+t.replace(/</g,"&lt;")+'</option>'});return s}
function movePerson(id,dest){var p=state.people.find(function(x){return x.id===id});if(!p)return;p.team=dest==="u"?null:Number(dest);saveLocal();render();msg(p.name+" moved.")}
function person(p){var d=document.createElement("div");d.className="person";d.draggable=true;d.dataset.id=p.id;
var n=document.createElement("span");n.className="name";n.textContent=p.name;d.appendChild(n);
var sel=document.createElement("select");sel.innerHTML=options();sel.onchange=function(){if(this.value!=="")movePerson(p.id,this.value)};d.appendChild(sel);
var back=document.createElement("button");back.type="button";back.className="mini gray";back.textContent="↩";back.title="Move to Unassigned";back.onclick=function(){movePerson(p.id,"u")};d.appendChild(back);
d.ondragstart=function(e){e.dataTransfer.setData("text/plain",String(p.id))};return d}
function bindZone(z){z.ondragover=function(e){e.preventDefault();z.classList.add("over")};z.ondragleave=function(){z.classList.remove("over")};z.ondrop=function(e){e.preventDefault();z.classList.remove("over");movePerson(Number(e.dataTransfer.getData("text/plain")),z.dataset.team)}}
function removeTeam(i){if(i<0||i>=state.teams.length)return;var old=state.teams[i];state.people.forEach(function(p){if(p.team===i)p.team=null;else if(typeof p.team==="number"&&p.team>i)p.team--});state.teams.splice(i,1);saveLocal();render();msg(old+" removed. Its bowlers were returned to Unassigned.")}
function render(){var un=document.getElementById("unassigned"),teams=document.getElementById("teams");un.innerHTML="";teams.innerHTML="";
state.people.filter(function(p){return p.team===null}).forEach(function(p){un.appendChild(person(p))});document.getElementById("uc").textContent="("+state.people.filter(function(p){return p.team===null}).length+")";bindZone(un);
state.teams.forEach(function(t,i){var card=document.createElement("section");card.className="team";var h=document.createElement("div");h.className="head";
var printName=document.createElement("span");printName.className="printOnly";printName.textContent=t;h.appendChild(printName);
var inp=document.createElement("input");inp.value=t;inp.onchange=function(){state.teams[i]=this.value.trim()||("Team "+(i+1));saveLocal();render();msg("Team renamed.")};h.appendChild(inp);
var x=document.createElement("button");x.type="button";x.className="red";x.textContent="×";x.title="Remove team";x.onclick=function(){removeTeam(i)};h.appendChild(x);
var z=document.createElement("div");z.className="zone";z.dataset.team=String(i);bindZone(z);state.people.filter(function(p){return p.team===i}).forEach(function(p){z.appendChild(person(p))});
card.appendChild(h);card.appendChild(z);teams.appendChild(card)})}
document.getElementById("addBowler").onclick=function(){var a=document.getElementById("newName"),v=a.value.trim();if(!v)return;state.people.push({id:state.nextId++,name:v,team:null});a.value="";saveLocal();render();msg(v+" added.")};
document.getElementById("addTeam").onclick=function(){state.teams.push("Team "+(state.teams.length+1));saveLocal();render();msg("Team added.")};
document.getElementById("reset").onclick=function(){state.people.forEach(function(p){p.team=null});saveLocal();render();msg("All bowlers returned to Unassigned.")};
document.getElementById("printView").onclick=function(){document.body.classList.toggle("printmode");this.textContent=document.body.classList.contains("printmode")?"Return to Builder":"Printable View"};
document.getElementById("returnBuilder").onclick=function(){document.body.classList.remove("printmode");document.getElementById("printView").textContent="Printable View";msg("Returned to Team Builder.");window.scrollTo(0,0)};
document.getElementById("save").onclick=function(){var blob=new Blob([JSON.stringify(state,null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="Bis-Man-Saved-Teams.json";document.body.appendChild(a);a.click();a.remove();msg("Team file saved.")};
document.getElementById("load").onchange=function(e){var f=e.target.files[0];if(!f)return;var r=new FileReader();r.onload=function(){try{var x=JSON.parse(r.result);if(!Array.isArray(x.teams)||!Array.isArray(x.people))throw 0;state=x;saveLocal();render();msg("Saved team file loaded.")}catch(err){msg("Could not load that file.")}};r.readAsText(f);this.value=""};
loadLocal();render();
})();
</script></body></html>
